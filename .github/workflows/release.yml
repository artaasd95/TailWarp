name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.0.0)
        required: true
        default: v1.0.0
  push:
    tags:
      - "v*.*.*"

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel --outdir dist/

      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: dist/*.whl

  build-cpu-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CPU Docker image
        run: docker build -f docker/Dockerfile.cpu -t tailwarp:cpu .

      - name: Smoke import
        run: docker run --rm tailwarp:cpu

  build-cuda-image:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Build CUDA image (build-only; may fail without GPU builder)
        run: |
          docker build -f docker/Dockerfile.cuda -t tailwarp:cuda \
            --build-arg CUDA_VERSION=12.2 .

  github-release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [build-wheel, build-cpu-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: python-wheel
          path: dist/

      - name: Create GitHub release (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          draft: true
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
