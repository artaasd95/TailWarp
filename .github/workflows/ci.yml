# TailWarp CI (v1.0) — CPU Python tests only (free-plan safe).
# GPU smoke and Black Swan replay: workflow_dispatch workflows.
# Ubuntu cmake + GTest deferred — see Tech-Debt.md TD-TW-04.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  python-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test deps
        run: |
          pip install --upgrade pip
          pip install .
          pip install pytest pandas matplotlib
          pip install -r app/requirements-black-swan-dashboard.txt

      - name: Pytest (CPU Python only)
        run: pytest tests/python/ tests/validation/ -v

  regression-warn:
    runs-on: ubuntu-latest
    needs: python-cpu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dry-run benchmark schema
        run: |
          pip install --upgrade pip
          python benchmarks/run_benchmarks.py --dry-run --run-id ci_schema_probe

      - name: Regression gate (warn-only on CPU)
        run: |
          python scripts/check_regression.py \
            --warn-only \
            --results benchmarks/results/ci_schema_probe/results.json \
            || true
